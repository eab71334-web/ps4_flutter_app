name: Build PS4 PKG and iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ps4-pkg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Clone and Build LibOrbisPkg (Self-Contained)
        run: |
          git clone https://github.com/maxton/LibOrbisPkg.git
          cd LibOrbisPkg
          dotnet publish PkgTool.Core/PkgTool.Core.csproj -c Release -r linux-x64 --self-contained true -o ./out

      - name: Build FPKG using PkgTool
        run: |
          chmod +x LibOrbisPkg/out/PkgTool.Core
          cd ps4_server
          ../LibOrbisPkg/out/PkgTool.Core pkg create project.gp4 . ps4_remote_host.pkg

      - name: Upload PS4 PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4-pkg
          path: ps4_server/ps4_remote_host.pkg

  build-ios-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Payload
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r ps4_hybrid_engine.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/ps4_hybrid_engine.ipa

  create-release:
    needs: [build-ps4-pkg, build-ios-ipa]
    runs-on: ubuntu-latest
    steps:
      - name: Download PS4 PKG
        uses: actions/download-artifact@v4
        with:
          name: ps4-pkg
          path: ./release-files

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: ./release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release Build #${{ github.run_number }}
          files: |
            ./release-files/ps4_remote_host.pkg
            ./release-files/ps4_hybrid_engine.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
