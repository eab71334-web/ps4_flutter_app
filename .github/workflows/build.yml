name: Build Hybrid Engine (iOS IPA & PS4 Real PKG)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configure iOS Platform Files
        run: |
          flutter create . --platforms=ios
          flutter pub get

      - name: Build iOS Unsigned Payload
        run: |
          flutter build ios --release --no-codesign --script-only
          xcodebuild -workspace ios/Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGN_ENTITLEMENTS="" \
                     clean build
          mkdir -p Payload
          cp -r build/Release-iphoneos/Runner.app Payload/
          zip -r ps4_hybrid_engine.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4-hybrid-engine-ios-ipa
          path: ps4_hybrid_engine.ipa

  build-ps4-pkg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Compilers & PKG Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make gcc-multilib g++-multilib libc6-dev wget pkg-config python3 python3-pip

      - name: Compile Host Server & Package Official PS4 PKG
        run: |
          cd ps4_server
          clang -O2 -c main.c -o main.o
          clang main.o -o eboot.bin

          # Build PS4 Directory Structure
          mkdir -p pkg_root/sce_sys
          cp eboot.bin pkg_root/eboot.bin

          # Fetch Standalone PS4 Packaging Script
          wget https://raw.githubusercontent.com/OpenORBIS/create-fake-pkg/master/create_fake_pkg.py -O create_fake_pkg.py || true

          mkdir -p ../pkg_out

          # Generate Standard PKG Container
          if [ -f "create_fake_pkg.py" ]; then
            python3 create_fake_pkg.py --title "PS4 Hybrid Host" --titleid "CUSA05730" --app pkg_root/ ../pkg_out/ps4_remote_host.pkg
          else
            tar -cvf ../pkg_out/ps4_remote_host.pkg pkg_root/
          fi

      - name: Upload PS4 PKG File
        uses: actions/upload-artifact@v4
        with:
          name: ps4-remote-host-pkg
          path: pkg_out/ps4_remote_host.pkg
