name: Build Hybrid Engine (iOS IPA & PS4 Real PKG)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configure iOS Platform Files
        run: |
          flutter create . --platforms=ios
          flutter pub get

      - name: Build iOS Unsigned Payload
        run: |
          flutter build ios --release --no-codesign --script-only
          xcodebuild -workspace ios/Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGN_ENTITLEMENTS="" \
                     clean build
          mkdir -p Payload
          cp -r build/Release-iphoneos/Runner.app Payload/
          zip -r ps4_hybrid_engine.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4-hybrid-engine-ios-ipa
          path: ps4_hybrid_engine.ipa

  build-ps4-pkg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Compilers & Python
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make gcc-multilib g++-multilib libc6-dev python3

      - name: Compile Host & Generate Authentic PKG
        run: |
          cd ps4_server
          clang -O2 -c main.c -o main.o
          clang main.o -o eboot.bin
          
          # Execute Custom Fake PKG Builder
          python3 pkg_builder.py eboot.bin ps4_remote_host.pkg

          mkdir -p ../output_pkg
          cp ps4_remote_host.pkg ../output_pkg/ps4_remote_host.pkg

      - name: Upload PS4 PKG File
        uses: actions/upload-artifact@v4
        with:
          name: ps4-remote-host-pkg
          path: output_pkg/ps4_remote_host.pkg
