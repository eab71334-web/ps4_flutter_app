name: Auto Create & Build Flutter (Android & iOS)

on:
  push:
    branches: [ main ]

jobs:
  # --------------------------------------------------
  # 1. بناء تطبيق أندرويد (APK)
  # --------------------------------------------------
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Auto Create Flutter Project Structure
        run: |
          flutter create . --org com.ps4app.app --project-name ps4_app

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-Release
          path: build/app/outputs/flutter-apk/app-release.apk

  # --------------------------------------------------
  # 2. بناء تطبيق آيفون (iOS Simulator & App)
  # --------------------------------------------------
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Auto Create Flutter Project Structure
        run: |
          flutter create . --org com.ps4app.app --project-name ps4_app

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Simulator App
        run: flutter build ios --simulator --no-codesign

      - name: Compress iOS Build
        run: |
          cd build/ios/iphonesimulator
          zip -r Runner.app.zip Runner.app

      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Runner-App
          path: build/ios/iphonesimulator/Runner.app.zip
