name: Build Hybrid Engine (iOS IPA & PS4 PKG)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configure iOS Platform Files
        run: |
          flutter create . --platforms=ios
          flutter pub get

      - name: Build Release Unsigned App
        run: |
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ps4_hybrid_engine.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4-hybrid-engine-ios-ipa
          path: ps4_hybrid_engine.ipa

  build-ps4-pkg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make gcc-multilib g++-multilib libc6-dev

      - name: Compile PS4 Host Code
        run: |
          cd ps4_server
          clang -c main.c -o main.o
          clang main.o -o ps4_remote_host.elf
          
          mkdir -p ../pkg_out
          cp ps4_remote_host.elf ../pkg_out/ps4_remote_host.pkg

      - name: Upload PS4 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4-remote-host-pkg
          path: pkg_out/ps4_remote_host.pkg
