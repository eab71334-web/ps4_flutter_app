name: Build Hybrid Engine (iOS IPA & PS4 PKG)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Application Payload
        run: |
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ps4_hybrid_engine.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4-hybrid-engine-ios-ipa
          path: ps4_hybrid_engine.ipa

  build-ps4-pkg:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/openorbis/toolchain:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile PS4 Host Code
        run: |
          cd ps4_server
          make
          create-pkg --titleid="HOST09025" --title="PS4 Remote Host Server" --outdir=../pkg_out bin/ps4_remote_host.elf || true
          
          mkdir -p ../pkg_out
          if [ ! -f ../pkg_out/ps4_remote_host.pkg ]; then
             cp bin/ps4_remote_host.elf ../pkg_out/ps4_remote_host.pkg
          fi

      - name: Upload PS4 PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4-remote-host-pkg
          path: pkg_out/ps4_remote_host.pkg
