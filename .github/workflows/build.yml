name: Build PS4 PKG and iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ps4-pkg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Compilers & Toolchain Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc g++ g++-multilib gcc-multilib clang wget dos2unix
          git clone --recursive https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git /tmp/OO_PS4_TOOLCHAIN
          echo "OO_PS4_TOOLCHAIN=/tmp/OO_PS4_TOOLCHAIN" >> $GITHUB_ENV

      - name: Compile PS4 Binary (eboot.bin)
        run: |
          cd ps4_server
          make

      - name: Build PKG using OpenOrbis Toolchain
        run: |
          cd ps4_server
          if [ -f "$OO_PS4_TOOLCHAIN/scripts/create-pkg.sh" ]; then
            bash $OO_PS4_TOOLCHAIN/scripts/create-pkg.sh .
          elif [ -f "$OO_PS4_TOOLCHAIN/bin/linux/orbis-pub-cmd" ]; then
            $OO_PS4_TOOLCHAIN/bin/linux/orbis-pub-cmd img_create project.gp4 output.pkg
          else
            echo "Searching for package creation tools..."
            find $OO_PS4_TOOLCHAIN -name "*pkg*"
          fi

      - name: Upload PS4 PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4-pkg
          path: ps4_server/*.pkg
          if-no-files-found: error

  build-ios-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable and Configure iOS Platform
        run: |
          flutter config --enable-ios
          flutter create --platforms=ios .
          flutter pub get

      - name: Build iOS Payload
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r ps4_hybrid_engine.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/ps4_hybrid_engine.ipa
          if-no-files-found: error
