name: Build PS4 PKG and iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ps4-pkg:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET Core 3.1 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '3.1.x'

      - name: Clone LibOrbisPkg
        run: |
          git clone https://github.com/maxton/LibOrbisPkg.git

      - name: Force .NET 3.1 Environment & Build PkgTool
        run: |
          echo '{"sdk":{"version":"3.1.426","rollForward":"latestFeature"}}' > global.json
          dotnet restore LibOrbisPkg/PkgTool.Core/PkgTool.Core.csproj
          dotnet publish LibOrbisPkg/PkgTool.Core/PkgTool.Core.csproj -c Release -r win-x64 --self-contained true -o ./pkgtool_bin

      - name: Generate Clean GP4 Project
        shell: powershell
        run: |
          $gp4Content = @"
          <?xml version="1.0" encoding="utf-8"?>
          <ps4_project version="1">
            <volume>
              <volume_type>pkg_ps4_app</volume_type>
              <volume_id>PS4VOLUME</volume_id>
              <volume_ts>2026-01-01 00:00:00</volume_ts>
              <package_id>CUSA00000_00</package_id>
              <content_id>IV0000-CUSA00000_00-0000000000000000</content_id>
              <passcode>00000000000000000000000000000000</passcode>
              <application_type>app_executable</application_type>
            </volume>
            <files image_path="">
              <file orig_path="sce_sys/param.sfo" target_path="sce_sys/param.sfo" />
              <file orig_path="sce_sys/icon0.png" target_path="sce_sys/icon0.png" />
              <file orig_path="eboot.bin" target_path="eboot.bin" />
            </files>
          </ps4_project>
          "@
          [System.IO.File]::WriteAllText("ps4_server\project.gp4", $gp4Content, (New-Object System.Text.UTF8Encoding($false)))

      - name: Build FPKG using PkgTool
        shell: cmd
        run: |
          pkgtool_bin\PkgTool.Core.exe pkg_build ps4_server\project.gp4 ps4_server

      - name: Upload PS4 PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4-pkg
          path: ps4_server/*.pkg
          if-no-files-found: error

  build-ios-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable and Configure iOS Platform
        run: |
          flutter config --enable-ios
          flutter create --platforms=ios .
          flutter pub get

      - name: Build iOS Payload
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r ps4_hybrid_engine.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/ps4_hybrid_engine.ipa
          if-no-files-found: error
