name: Build PS4 PKG and iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ps4-pkg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Compilers & Toolchain Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc g++ g++-multilib gcc-multilib clang wget dos2unix
          git clone --recursive https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git /tmp/OO_PS4_TOOLCHAIN
          echo "OO_PS4_TOOLCHAIN=/tmp/OO_PS4_TOOLCHAIN" >> $GITHUB_ENV

      - name: Install LibSSL 1.1 for .NET Core 3.1 Compatibility
        run: |
          wget http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb
          sudo dpkg -i libssl1.1_1.1.1f-1ubuntu2_amd64.deb

      - name: Compile PS4 Binary (eboot.bin)
        run: |
          cd ps4_server
          make

      - name: Setup .NET Core 3.1 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '3.1.x'

      - name: Clone LibOrbisPkg
        run: |
          git clone https://github.com/maxton/LibOrbisPkg.git

      - name: Build PkgTool
        run: |
          dotnet restore LibOrbisPkg/PkgTool.Core/PkgTool.Core.csproj
          dotnet publish LibOrbisPkg/PkgTool.Core/PkgTool.Core.csproj -c Release -r linux-x64 --self-contained true -o ./pkgtool_bin

      - name: Generate Valid Project GP4
        run: |
          cat << 'EOF' > ps4_server/project.gp4
          <?xml version="1.0" encoding="utf-8"?>
          <ps4_project version="1.0">
            <volume>
              <volume_type>pkg_ps4_app</volume_type>
              <volume_id>PS4VOLUME</volume_id>
              <volume_ts>2023-01-01 00:00:00</volume_ts>
              <package_version>01.00</package_version>
              <package_sub_version>00</package_sub_version>
              <app_path></app_path>
            </volume>
            <files image_path="">
              <file orig_path="eboot.bin" target_path="eboot.bin" />
              <file orig_path="sce_sys/param.sfo" target_path="sce_sys/param.sfo" />
              <file orig_path="sce_sys/icon0.png" target_path="sce_sys/icon0.png" />
            </files>
          </ps4_project>
          EOF
          dos2unix ps4_server/project.gp4

      - name: Build Real PKG using PkgTool
        run: |
          ./pkgtool_bin/PkgTool.Core pkg_build ps4_server/project.gp4 ps4_server

      - name: Upload PS4 PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4-pkg
          path: ps4_server/*.pkg
          if-no-files-found: error

  build-ios-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable and Configure iOS Platform
        run: |
          flutter config --enable-ios
          flutter create --platforms=ios .
          flutter pub get

      - name: Build iOS Payload
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r ps4_hybrid_engine.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/ps4_hybrid_engine.ipa
          if-no-files-found: error
