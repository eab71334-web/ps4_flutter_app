name: Auto Create & Build Flutter (Android & iOS)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Reconstruct Project & Config Android SDK
        run: |
          flutter create . --org com.ps4app.app --platforms android,ios
          flutter pub get
          sed -i 's/compileSdkVersion.*/compileSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion.*/targetSdkVersion 34/g' android/app/build.gradle || true

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ps4-emulator-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS IPA Package
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Reconstruct Project & Platforms
        run: |
          flutter create . --org com.ps4app.app --platforms android,ios
          flutter pub get

      - name: Inject Complete iOS Permissions (Info.plist)
        run: |
          PLIST="ios/Runner/Info.plist"
          sed -i '' '/<\/dict>/i\
          <key>NSPhotoLibraryUsageDescription<\/key>\
          <string>Need access to pick game files<\/string>\
          <key>NSCameraUsageDescription<\/key>\
          <string>Need access to camera<\/string>\
          <key>NSMicrophoneUsageDescription<\/key>\
          <string>Need access to mic<\/string>\
          <key>NSUIFileSharingEnabled<\/key>\
          <true\/>\
          <key>LSSupportsOpeningDocumentsInPlace<\/key>\
          <true\/>\
          ' $PLIST || true

      - name: Build iOS App for Real Devices (Unsigned Release)
        run: flutter build ios --release --no-codesign

      - name: Package Release IPA for Sideloading
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ps4_emulator_app.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4-emulator-ios-ipa
          path: ps4_emulator_app.ipa
