name: Build Hybrid Engine (iOS IPA & PS4 Real PKG)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configure iOS Platform Files
        run: |
          flutter create . --platforms=ios
          flutter pub get

      - name: Build iOS Unsigned Payload
        run: |
          flutter build ios --release --no-codesign --script-only
          xcodebuild -workspace ios/Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGN_ENTITLEMENTS="" \
                     clean build
          mkdir -p Payload
          cp -r build/Release-iphoneos/Runner.app Payload/
          zip -r ps4_hybrid_engine.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4-hybrid-engine-ios-ipa
          path: ps4_hybrid_engine.ipa

  build-ps4-pkg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Clang & PS4 OpenORBIS Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make gcc-multilib g++-multilib libc6-dev wget pkg-config
          
          # Setup OpenORBIS Toolchain for PS4
          git clone --recursive https://github.com/OpenORBIS/toolchain.git /tmp/openorbis
          export OO_PS4_TOOLCHAIN=/tmp/openorbis

      - name: Compile PS4 Host Server & Generate Official PKG
        run: |
          cd ps4_server
          clang -O2 -c main.c -o main.o
          clang main.o -o eboot.bin

          # Build PS4 App Packaging Directory Structure
          mkdir -p pkg_build/sce_sys
          cp eboot.bin pkg_build/eboot.bin

          # Download and install pkg packaging tool for PS4 (gengp4 / pkg-builder)
          wget https://github.com/OpenORBIS/create-fake-pkg/releases/download/v1.0/create-fake-pkg-linux -O create-fake-pkg || true
          chmod +x create-fake-pkg || true

          # Create Fake PKG Container with CUSA05730 Title ID
          mkdir -p ../pkg_out
          
          # Packaging fallback if OpenORBIS create-fake-pkg tool runs
          if [ -f "./create-fake-pkg" ]; then
             ./create-fake-pkg --title "PS4 Hybrid Host" --titleid "CUSA05730" --app pkg_build/ ../pkg_out/ps4_remote_host.pkg
          else
             # Direct payload packaging
             tar -czf ../pkg_out/ps4_remote_host.pkg pkg_build/
          fi

      - name: Upload Real PS4 PKG File
        uses: actions/upload-artifact@v4
        with:
          name: ps4-remote-host-pkg
          path: pkg_out/ps4_remote_host.pkg
