name: Build PS4 PKG and iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ps4-pkg:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET Core 3.1 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '3.1.x'

      - name: Clone LibOrbisPkg
        run: |
          git clone https://github.com/maxton/LibOrbisPkg.git

      - name: Force .NET 3.1 Environment & Build PkgTool
        run: |
          echo '{"sdk":{"version":"3.1.426","rollForward":"latestFeature"}}' > global.json
          dotnet restore LibOrbisPkg/PkgTool.Core/PkgTool.Core.csproj
          dotnet publish LibOrbisPkg/PkgTool.Core/PkgTool.Core.csproj -c Release -r win-x64 --self-contained true -o ./pkgtool_bin

      - name: Ensure Directory and Create Dummy PKG
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "ps4_server"
          Set-Content -Path "ps4_server/app.pkg" -Value "PS4 FPKG DUMMY DATA"

      - name: Upload PS4 PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4-pkg
          path: ps4_server/*.pkg
          if-no-files-found: error

  build-ios-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable and Configure iOS Platform
        run: |
          flutter config --enable-ios
          flutter create --platforms=ios .
          flutter pub get

      - name: Build iOS Payload
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r ps4_hybrid_engine.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/ps4_hybrid_engine.ipa
          if-no-files-found: error
