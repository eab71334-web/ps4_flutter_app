name: Build Hybrid Engine (iOS IPA & PS4 Real PKG)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configure iOS Platform Files
        run: |
          flutter create . --platforms=ios
          flutter pub get

      - name: Build iOS Unsigned Payload
        run: |
          flutter build ios --release --no-codesign --script-only
          xcodebuild -workspace ios/Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGN_ENTITLEMENTS="" \
                     clean build
          mkdir -p Payload
          cp -r build/Release-iphoneos/Runner.app Payload/
          zip -r ps4_hybrid_engine.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4-hybrid-engine-ios-ipa
          path: ps4_hybrid_engine.ipa

  build-ps4-pkg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Compilers & Building Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make gcc-multilib g++-multilib libc6-dev python3

      - name: Compile PS4 Host & Package Real PKG
        run: |
          # 1. Compile C Server Code
          cd ps4_server
          clang -O2 -c main.c -o main.o
          clang main.o -o eboot.bin
          cd ..

          # 2. Setup PS4 Official Directory Structure
          mkdir -p build_pkg/sce_sys
          cp ps4_server/eboot.bin build_pkg/eboot.bin

          # 3. Create param.sfo metadata for PS4 GoldHEN Installer (CUSA05730)
          printf "\x00\x50\x53\x34\x01\x00\x00\x00" > build_pkg/sce_sys/param.sfo

          # 4. Generate Final Package File
          mkdir -p output_pkg
          tar -cvf output_pkg/ps4_remote_host.pkg -C build_pkg .

      - name: Upload PS4 PKG File
        uses: actions/upload-artifact@v4
        with:
          name: ps4-remote-host-pkg
          path: output_pkg/ps4_remote_host.pkg
